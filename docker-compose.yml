services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: platform, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U platform -d platform"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}
  api:
    build: ./services/api
    environment: {DATABASE_URL: postgresql://platform:platform@postgres:5432/platform, REDIS_URL: redis://redis:6379/0}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["8000:8000"]
  auth:
    build: ./services/auth
    environment: {JWT_SECRET: local-development-secret}
    ports: ["8001:8001"]
  worker:
    build: ./services/worker
    environment: {REDIS_URL: redis://redis:6379/0}
    depends_on: {redis: {condition: service_healthy}}
  frontend:
    build: ./frontend
    depends_on: [api, auth]
    ports: ["8080:80"]

<!doctype html><html><head><meta charset="utf-8"><title>Cloud Platform</title><style>body{font-family:system-ui;background:#07111f;color:#eef6ff;padding:40px}.card{background:#102235;padding:24px;border-radius:14px}</style></head><body><h1>Multi-Service Cloud Platform</h1><div class="card"><p id="health">Checking API...</p><button onclick="loadData()">Create work item</button><pre id="out"></pre></div><script>async function loadData(){let r=await fetch('/api/items',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:'portfolio-work-item'})});out.textContent=JSON.stringify(await r.json(),null,2)}fetch('/api/health').then(r=>r.json()).then(x=>health.textContent='API: '+x.status)</script></body></html>
